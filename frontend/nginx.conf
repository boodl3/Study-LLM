server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches spring.servlet.multipart.max-request-size (55MB) so nginx never rejects an upload
    # the backend would have accepted — SourceService returns its own 50MB message instead.
    client_max_body_size 55m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Docker's embedded DNS, re-resolved: without this nginx pins the backend's IP at
        # startup and 502s forever after `docker compose up -d --build backend` moves it.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend "http://backend:8080";
        proxy_pass $backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: POST /api/v1/notebooks/{id}/chat flushes one event per token. Buffering or gzip
        # would hold the whole answer and deliver it as one blob. Timeouts must clear
        # OllamaChatClient's 10-minute request timeout; the client sets none of its own.
        proxy_buffering off;
        gzip off;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 15m;
        proxy_read_timeout 15m;
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Unhashed, copied verbatim from public/ and referenced as /fonts/... by tokens.css.
    location /fonts/ {
        types { font/otf otf; }
        default_type font/otf;
        expires 30d;
    }

    # Must revalidate or a stale copy pins users to deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # BrowserRouter: /login, /settings, /notebooks/:id have no file on disk. Also required
    # because client.ts does a full navigation to /login on 401.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
